< html>!
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Image Converter</title>
    <style>
        * {
            box-sizing: border-box;
        }
    DOCTYPE    body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .converter-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            color: #2d3436;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .file-upload-label {
            display: block;
            background: #f1f2f6;
            border: 2px dashed #0984e3;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            color: #0984e3;
            font-weight: bold;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .select-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #636e72;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            font-size: 16px;
            background: #f8f9fa;
            outline: none;
        }
        .btn-convert {
            width: 100%;
            padding: 14px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .result-box {
            margin-top: 25px;
            display: none;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #e17055;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="converter-card">
        <h2>Image Converter</h2>
        
        <label class="file-upload-label" for="uploadImage">
            📁 फोटो चुनें (Browse)
        </label>
        <input type="file" id="uploadImage" accept="image/*">
        <p id="fileName" style="font-size: 13px; color: #b2bec3; margin-top: -10px; margin-bottom: 20px;">कोई फाइल नहीं चुनी गई</p>

        <div class="select-group">
            <label>किस फॉर्मेट में बदलना है?</label>
            <select id="formatSelect">
                <option value="image/png">PNG (.png)</option>
                <option value="image/jpeg">JPG / JPEG (.jpg)</option>
                <option value="image/webp">WebP (.webp)</option>
            </select>
        </div>
        
        <button class="btn-convert" id="convertBtn">Convert Image</button>
        
        <div class="result-box" id="resultBox">
            <a id="downloadLink" class="btn-download" href="#" download="converted.png">📥 डाउनलोड करें (Download)</a>
        </div>
    </div>

    <script>
        const uploadImage = document.getElementById('uploadImage');
        const fileName = document.getElementById('fileName');
        const formatSelect = document.getElementById('formatSelect');
        const convertBtn = document.getElementById('convertBtn');
        const resultBox = document.getElementById('resultBox');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFile = null;

        uploadImage.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                resultBox.style.display = 'none';
            }
        });

        convertBtn.addEventListener('click', function() {
            if (!selectedFile) {
                alert('कृपया पहले कोई फोटो चुनें!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const targetFormat = formatSelect.value;
                    const imageUrl = canvas.toDataURL(targetFormat, 0.95);

                    let ext = 'png';
                    if (targetFormat === 'image/jpeg') ext = 'jpg';
                    if (targetFormat === 'image/webp') ext = 'webp';

                    downloadLink.href = imageUrl;
                    downloadLink.download = `converted-image.${ext}`;
                    resultBox.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(selectedFile);
        });
    </script>
</body>
</html>
